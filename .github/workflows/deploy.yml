name: Deploy

on:
  push:
    tags:
      - '*deploy*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/wedding-app
            # Garde le contenu actuel de inputs/ (celui déjà sur la machine)
            cp -r inputs /tmp/inputs_backup
 
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Restaurer le contenu de inputs/ depuis la sauvegarde
            cp -r /tmp/inputs_backup/* inputs/

            docker build -t wedding-app:latest .
            docker stop wedding-app || true
            docker rm wedding-app || true
            docker run -d \
              --name wedding-app \
              --memory="400m" \
              --restart always \
              -p 127.0.0.1:8000:8000 \
              -v ~/wedding-app/logs:/app/logs \
              -v ~/wedding-app/inputs:/app/inputs \
              --env-file .env \
              wedding-app:latest