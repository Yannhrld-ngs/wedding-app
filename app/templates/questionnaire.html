{% extends "base.html" %}
{% block title %}Questionnaire{% endblock %}
{% block content %}
<div class="card">
  <h2>Questionnaire — {{ invite.prenom }} {{ invite.nom }}</h2>
  <form method="post" action="/invite/{{ invite.token }}/questionnaire">

    <label>Serez-vous {{ invite.accord("présent", "présente") }} ?</label>
    <select name="presence" required>
      <option value="present" {% if invite.statut_presence.value == "present" %}selected{% endif %}>Je serai {{ invite.accord("présent", "présente") }}</option>
      <option value="absent" {% if invite.statut_presence.value == "absent" %}selected{% endif %}>Je ne pourrai pas venir</option>
    </select>

    <label>Allergies / restrictions alimentaires</label>
    <textarea name="allergies" rows="3" placeholder="Ex : allergie aux fruits à coque, végétarien...">{{ invite.allergies or "" }}</textarea>

    <label>Comment prévoyez-vous de rejoindre le lieu ?</label>
    <select name="mode_transport">
      <option value="">-- Choisir --</option>
      {% for mode in transport_modes %}
        <option value="{{ mode.value }}" {% if invite.mode_transport and invite.mode_transport.value == mode.value %}selected{% endif %}>
          {{ mode.value | capitalize }}
        </option>
      {% endfor %}
    </select>

    <label>Précisions (optionnel)</label>
    <textarea name="transport_details" rows="2" placeholder="Ex : je peux emmener 2 personnes en voiture">{{ invite.transport_details or "" }}</textarea>

    <p style="margin-top: 24px;">
      <button class="button" type="submit">Envoyer ma réponse</button>
    </p>
  </form>
  <p><a href="/invite/{{ invite.token }}">← Retour à l'invitation</a></p>
</div>
{% endblock %}
