<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ wedding_name_1 }} &amp; {{ wedding_name_2 }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f0e4;
    --cream-soft: rgba(246,240,228,0.92);
    --ink:#2c2620;
    --ink-soft: rgba(44,38,32,0.72);
    --gold:#c9a24b;
    --overlay-top: rgba(20,16,12,0.15);
    --overlay-bottom: rgba(15,12,9,0.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Jost', sans-serif;
    color:var(--cream);
  }

  .hero{
    position:relative;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background-color:#1a1712;
  }

  .hero__bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 30%;
    z-index:0;
  }

  .hero__overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:
      linear-gradient(180deg, var(--overlay-top) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 55%, var(--overlay-bottom) 100%);
  }

  .hero__content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    padding:14vh 24px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation: riseIn 1.1s ease-out both;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:12px;
    font-weight:400;
    color:var(--cream);
    opacity:0.85;
    margin-bottom:18px;
  }

  .names{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:clamp(48px, 10vw, 108px);
    line-height:1.08;
    margin:0;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }

  .names .amp{
    display:block;
    font-style:italic;
    font-size:0.55em;
    color:var(--gold);
    margin:6px 0;
  }

  .actions{
    margin-top:40px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
  }

  .btn{
    font-family:'Jost', sans-serif;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:14px 30px;
    border-radius:999px;
    border:1px solid var(--cream);
    background:transparent;
    color:var(--cream);
    cursor:pointer;
    transition:all 0.25s ease;
  }

  .btn:hover, .btn:focus-visible{
    background:var(--cream);
    color:var(--ink);
    outline:none;
  }

  .btn:focus-visible{
    box-shadow:0 0 0 3px rgba(201,162,75,0.6);
  }

  .btn--primary{
    background:var(--cream);
    color:var(--ink);
    border-color:var(--cream);
  }

  .btn--primary:hover, .btn--primary:focus-visible{
    background:var(--gold);
    border-color:var(--gold);
    color:#1a1712;
  }

  /* Guest code panel */
  .guest-panel{
    margin-top:14px;
    width:100%;
    max-width:260px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height 0.4s ease, opacity 0.35s ease, margin-top 0.35s ease;
  }

  .guest-panel.is-open{
    max-height:250px;
    opacity:1;
  }

  .guest-panel__form{
    display:flex;
    flex-direction:column;
    gap:3px;
    background:var(--cream-soft);
    border-radius:16px;
    padding:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }

  .guest-panel__input{
    font-family:'Jost', sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(44,38,32,0.25);
    background:#fff;
    color:var(--ink);
    text-align:center;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .guest-panel__input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .guest-panel__submit{
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:999px;
    border:none;
    background:var(--ink);
    color:var(--cream);
    cursor:pointer;
    transition: background 0.2s ease;
  }

  .guest-panel__submit:hover, .guest-panel__submit:focus-visible{
    background:var(--gold);
    color:#1a1712;
    outline:none;
  }

  .guest-panel__error{
    font-size:12px;
    color:#b23a2f;
    min-height:14px;
  }

  @media (max-width: 560px){
    .actions{
      flex-direction:column;
      width:100%;
      max-width:320px;
    }
    .btn{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .hero__content{ animation:none; }
    .guest-panel{ transition:none; }
  }
</style>
</head>
<body>

<section class="hero">
  <img class="hero__bg" src="{{ home_image_url }}" alt="{{ wedding_name_1 }} et {{ wedding_name_2 }}">
  <div class="hero__overlay"></div>

  <div class="hero__content">
    <h1 class="names">
      {{ wedding_name_1 }}
      <span class="amp">&amp;</span>
      {{ wedding_name_2 }}
    </h1>

    <div class="actions">
      <button type="button" class="btn" id="guestCodeBtn" aria-expanded="{{ 'true' if GUEST_CODE_ERROR else 'false' }}" aria-controls="guestPanel">
        Code invité
      </button>
      <a class="btn btn--primary" href="/organisateur/login">
        Organisateur
      </a>
    </div>

    <div class="guest-panel{% if GUEST_CODE_ERROR %} is-open{% endif %}" id="guestPanel">
      <form class="guest-panel__form" action="{{ GUEST_CODE_SUBMIT_URL }}" method="post" id="guestCodeForm">
        <label for="guestCodeInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">
          Code invité
        </label>
        <input
          type="text"
          id="guestCodeInput"
          name="guest_code"
          class="guest-panel__input"
          placeholder="Entrez votre code"
          autocomplete="off"
          required
        >
        <p class="guest-panel__error" id="guestCodeError">{{ GUEST_CODE_ERROR|default('') }}</p>
        <button type="submit" class="guest-panel__submit">Valider</button>
      </form>
    </div>
  </div>
</section>

<script>
  (function(){
    var toggleBtn = document.getElementById('guestCodeBtn');
    var panel = document.getElementById('guestPanel');
    var input = document.getElementById('guestCodeInput');

    toggleBtn.addEventListener('click', function(){
      var isOpen = panel.classList.toggle('is-open');
      toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      if(isOpen){
        window.requestAnimationFrame(function(){ input.focus(); });
      }
    });
  })();
</script>

</body>
</html>
